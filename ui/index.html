<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tds ProtoStudio</title>
<style>
  :root {
    --ink: #111114; --mute: #8a8a92; --line: #e4e4e8; --soft: #f5f5f7; --pink: #d6336c;
    font-family: Inter, system-ui, sans-serif; font-size: 13px; color: var(--ink);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f7f7f8; height: 100vh; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 12px; }
  button:hover { background: var(--soft); }
  button.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
  button.dark:hover { background: #2b2b33; }
  button:disabled { opacity: .4; cursor: default; }
  input, select, textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink); }

  .top { height: 56px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 20px; gap: 12px; }
  .brand { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
  .brand span { color: var(--pink); }
  .top .status { margin-left: auto; color: var(--mute); font-size: 12px; }
  .top .status.err { color: #c0392b; }

  /* library */
  .library { padding: 32px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; align-content: start; overflow: auto; height: calc(100vh - 56px); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; min-height: 200px; }
  .card:hover { border-color: #ccc; }
  .card .thumb { height: 120px; flex: 0 0 120px; background: linear-gradient(160deg, #6b2d8a, #2a0e4a); }
  .card .thumb.blank { background: var(--soft); }
  .card .body { flex: 1 1 auto; padding: 12px 14px; color: var(--ink); display: block; }
  .card h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.3; }
  .card .status { margin: 0; color: var(--mute); font-size: 12px; line-height: 1.45; }
  .card.new { border: 1px dashed #c8c8d0; background: transparent; display: flex; align-items: center; justify-content: center; min-height: 220px; color: var(--mute); }

  /* modal */
  .scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .35); display: none; align-items: center; justify-content: center; z-index: 10; }
  .scrim.open { display: flex; }
  .modal { background: #fff; border-radius: 16px; width: 400px; padding: 28px; box-shadow: 0 20px 60px rgb(0 0 0 / .2); }
  .modal h2 { font-size: 17px; margin: 0 0 20px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .modal h2 button { border: 0; background: none; padding: 0 4px; font-size: 18px; color: var(--mute); }
  .modal label { display: block; color: var(--mute); font-size: 12px; margin: 14px 0 6px; }
  .modal .foot { margin-top: 22px; }
  .modal .foot button { width: 100%; padding: 11px; }
  .modal .err { color: #c0392b; margin-top: 10px; min-height: 16px; font-size: 12px; }
  .modal textarea { resize: vertical; }

  /* canvas: every direction on one surface, zoomable and scrollable */
  .ws { height: calc(100vh - 56px); }
  .canvas { position: relative; height: 100%; }
  .viewport { position: absolute; inset: 0; overflow: hidden; cursor: grab; background: #f2f2f4; touch-action: none; }
  .viewport.dragging { cursor: grabbing; }
  .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .row { margin-bottom: 150px; }
  .row-head { max-width: 900px; margin-bottom: 22px; }
  .row-head h3 { font-size: 18px; margin: 0 0 6px; font-weight: 600; }
  .row-head p { margin: 0; color: var(--mute); font-size: 13px; line-height: 1.45; }
  .row-screens { display: grid; grid-template-columns: repeat(4, max-content); gap: 56px; align-items: start; }
  .screen { display: flex; flex-direction: column; gap: 10px; flex: 0 0 auto; }
  .screen .label { font-weight: 600; font-size: 14px; }
  .screen .purpose { color: var(--mute); font-size: 13px; line-height: 1.4; }
  .frame { position: relative; background: #fff; border-radius: 22px; border: 1px solid var(--line); overflow: hidden; box-shadow: 0 6px 24px rgb(0 0 0 / .06); }
  .frame iframe { border: 0; display: block; background: #fff; }
  .skel, .skel-bar { background: linear-gradient(90deg, #ececef 0%, #f6f6f8 50%, #ececef 100%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 8px; }
  .skel-bar { height: 10px; }
  .skel { border-radius: 22px; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  .busy { color: var(--mute); line-height: 1.6; margin-top: 8px; }
  .zoom { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 6px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
  .zoom button { padding: 6px 10px; min-width: 40px; }
  .zoom button#zLevel { min-width: 64px; }
  /* radio buttons keep their natural size; the global input rule would stretch them */
  input[type="radio"] { width: auto; padding: 0; margin: 0; border: 0; background: none; }
</style>
</head>
<body>

<div class="top">
  <button id="back" style="display:none">←</button>
  <div class="brand" id="brand">tds <span>Proto</span>Studio</div>
  <div id="projectBar" style="display:none;align-items:center;gap:8px">
    <input id="projName" style="width:320px;font-weight:600" aria-label="Project name">
    <button id="shareBtn" title="Save the project and copy a link others can open">Share</button>
    <button id="projDelete" title="Delete project" aria-label="Delete project" style="padding:7px 10px;display:flex;align-items:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
  </div>
  <div class="status" id="status"></div>
  <button id="settingsBtn">Settings</button>
  <button class="dark" id="newBtn">New Prototype</button>
</div>

<div id="library" class="library"></div>

<div class="ws" id="ws" style="display:none">
  <div class="canvas">
    <div class="viewport" id="vp">
      <div class="world" id="world"></div>
    </div>
    <div class="zoom">
      <button id="zOut" title="Zoom out">−</button>
      <button id="zLevel" title="Reset to 100%">100%</button>
      <button id="zIn" title="Zoom in">+</button>
      <button id="zFit" title="Fit everything">Fit</button>
    </div>
  </div>
</div>

<div class="scrim" id="setScrim">
  <div class="modal">
    <h2>Settings <button id="setClose">×</button></h2>
    <label for="setUrl">Pipedream trigger URL</label>
    <input id="setUrl" placeholder="https://….m.pipedream.net">
    <label for="setToken">Token (only if the trigger requires one)</label>
    <input id="setToken" type="password" placeholder="Optional">
    <label for="setSaveUrl">Save flow URL (used by Share)</label>
    <input id="setSaveUrl" placeholder="https://….m.pipedream.net">
    <div class="foot"><button class="dark" id="setSave">Save</button></div>
    <div class="err">Saved in this browser only. Nothing is stored in the repo.</div>
  </div>
</div>

<div class="scrim" id="scrim">
  <div class="modal">
    <h2>New prototype <button id="close">×</button></h2>
    <label for="mSpec">Spec Sheet</label>
    <input id="mSpec" placeholder="Confluence link">
    <label for="mText">…or paste the brief</label>
    <textarea id="mText" rows="3" placeholder="Brief text (used when there's no link)"></textarea>
    <label for="mDevice">Device</label>
    <select id="mDevice"><option value="mobile">Mobile (390 × 874)</option><option value="desktop">Desktop (1280 × 800)</option></select>
    <div class="foot"><button class="dark" id="mGo">Generate Design Directions</button></div>
    <div class="err" id="mErr"></div>
  </div>
</div>

<script>
const KEY = 'tds-protostudio-v1';
const SIZES = { desktop: { w: 1280, h: 800, label: 'Desktop' }, mobile: { w: 390, h: 874, label: 'Mobile' } };

// ── state ────────────────────────────────────────────────────────────────────
// A prototype: { id, title, brief: { briefUrl, briefContent, device }, directions: [{ name, description, device, screens, failed, error }], shareId }
let db = { prototypes: [] };
let current = null;   // id of the open prototype, or null for the library
let busy = {};        // id -> true while directions are being written or designed
let lastCallError = '';

// The library is kept in IndexedDB. localStorage holds about 5 MB, and a few prototypes with their screen HTML
// filled it, so the save threw in the middle of a generation. IndexedDB has far more room.
const DB_NAME = 'wireframe-agent', STORE = 'library';
function openLibrary() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function libraryPut(value) {
  const d = await openLibrary();
  return new Promise((res, rej) => {
    const tx = d.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(value, KEY);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function libraryGet() {
  const d = await openLibrary();
  return new Promise((res, rej) => {
    const r = d.transaction(STORE).objectStore(STORE).get(KEY);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
// Saves are queued, so a slow write never overlaps another, and a failed write reports itself
// instead of stopping the generation that called it.
let writing = Promise.resolve();
function save() {
  const snapshot = JSON.stringify(db);
  writing = writing.then(() => libraryPut(snapshot)).catch(e => status('Could not save: ' + e.message, true));
}
async function load() {
  try {
    const raw = await libraryGet();
    if (raw) { db = JSON.parse(raw); return; }
    // First run on this version: take the library from the old localStorage copy, if there is one.
    const old = localStorage.getItem(KEY);
    if (old) { db = JSON.parse(old); save(); }
  } catch (_) {}
}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const getProto = (id) => db.prototypes.find(p => p.id === id);
const cur = () => getProto(current);
// The flow names a screen with `title` in some outputs and `name` in others.
const withName = (s) => ({ ...s, name: s.name || s.title || 'Screen' });
const deviceOf = (p) => (p.brief?.device === 'desktop' ? 'desktop' : 'mobile');

function status(text, isErr) { const s = $('status'); s.textContent = text; s.classList.toggle('err', !!isErr); }

// ── library ──────────────────────────────────────────────────────────────────
function renderLibrary() {
  $('ws').style.display = 'none';
  $('library').style.display = 'grid';
  $('back').style.display = 'none';
  $('projectBar').style.display = 'none';
  $('brand').style.display = '';
  const cards = db.prototypes.map(p => `
    <div class="card" data-open="${p.id}">
      <div class="thumb ${p.directions.length ? '' : 'blank'}"></div>
      <div class="body"><h3>${esc(p.title || 'Untitled prototype')}</h3>
        <p class="status">${busy[p.id] ? 'Generating directions…' : (p.directions.length ? p.directions.length + ' directions' : 'Not generated')}</p></div>
    </div>`).join('');
  $('library').innerHTML = cards + `<div class="card new" id="newCard">+ New prototype</div>`;
  $('library').querySelectorAll('[data-open]').forEach(c => c.onclick = () => openProto(c.dataset.open));
  $('newCard').onclick = openModal;
}

// ── generate form ────────────────────────────────────────────────────────────
function openModal() { $('mErr').textContent = ''; $('scrim').classList.add('open'); }
function closeModal() { $('scrim').classList.remove('open'); }
$('newBtn').onclick = openModal;
$('close').onclick = closeModal;
$('scrim').onclick = (e) => { if (e.target === $('scrim')) closeModal(); };

$('mGo').onclick = async () => {
  const brief = { briefUrl: $('mSpec').value.trim(), briefContent: $('mText').value.trim(), device: $('mDevice').value };
  if (!brief.briefUrl && !brief.briefContent) { $('mErr').textContent = 'Add a spec sheet link or paste the brief.'; return; }
  const p = { id: 'p' + Date.now(), title: '', brief, directions: [] };
  db.prototypes.unshift(p); save();
  closeModal();
  openProto(p.id);
  busy[p.id] = true; render();

  // 1. The content designer writes the three directions: names, descriptions, screen titles and purposes.
  const data = await call({ mode: 'directions', ...brief }, 'Writing directions');
  if (!data) { busy[p.id] = false; render(); return; }
  p.title = data.title || 'Untitled prototype';
  // The device is chosen up front, so every direction uses it. The content designer's device is ignored.
  p.directions = (data.directions || []).map(d => ({
    ...d, name: d.title || d.name || '', device: brief.device, screens: (d.screens || []).map(withName),
  }));
  save(); status('Designing screens'); render();

  // 2. The wireframe designer designs each direction as its own request, so screens fill in as each one finishes.
  await Promise.all(p.directions.map(d => designDirection(p, d)));
  busy[p.id] = false;
  const failed = p.directions.filter(d => d.failed).length;
  save();
  status(failed ? failed + ' direction' + (failed > 1 ? 's' : '') + ' did not finish. Use Retry under that direction.' : 'Directions ready', failed > 0);
  render();
};

// Designs one direction in batches of two screens, one batch after another. Each batch is given the
// designs made so far, so the screens keep the same look. Each request stays short enough to finish.
async function designDirection(p, d, onlyFailed = false) {
  const outline = (d.screens || []).slice();
  // Batches of two screens: a larger batch can run past Pipedream's time limit.
  const all = outline.map((_, i) => i);
  const batches = [];
  for (let k = 0; k < all.length; k += 2) batches.push(all.slice(k, k + 2));
  // Each request sends the direction's outline without the HTML, plus the screens to design.
  const brief = { name: d.name, description: d.description, device: d.device,
    screens: outline.map(({ html, ...rest }) => rest) };
  let error = '';
  for (const indexes of batches) {
    const needed = !onlyFailed || indexes.some(i => !d.screens[i]?.html || d.screens[i].failed);
    if (!needed) continue;
    // The designs so far, so this batch matches their look.
    const reference = d.screens.filter(s => s && s.html && !s.failed)
      .map(({ name, title, html }) => ({ name: name || title, html }));
    const out = await call({ mode: 'wireframes', ...p.brief, selectedOption: brief,
      screenIndexes: indexes, referenceScreens: reference }, null, { wait: false });
    if (out && out.screens) {
      indexes.forEach((i, k) => {
        const got = out.screens[k];
        // The device the user chose is the device of every screen, whatever the model wrote.
        d.screens[i] = got
          ? { ...got, id: outline[i].id || got.id, name: outline[i].name, device: p.brief?.device || got.device, failed: false }
          : { ...outline[i], failed: true };
      });
    } else {
      error = lastCallError;
      indexes.forEach(i => { d.screens[i] = { ...outline[i], failed: true }; });
    }
    save(); render();
  }
  d.failed = d.screens.some(x => x && x.failed);
  d.error = d.failed ? error : '';
  save(); render();
}

// Retries one direction after it failed.
async function retryDirection(p, i) {
  const d = p.directions[i];
  if (!d || busy[p.id]) return;
  busy[p.id] = true; render();
  await designDirection(p, d, true);
  busy[p.id] = false;
  const failed = p.directions.filter(x => x.failed).length;
  save();
  status(failed ? failed + ' still failing. Try again.' : 'Directions ready', failed > 0);
  render();
}

// ── api ──────────────────────────────────────────────────────────────────────
// The page calls the Pipedream trigger directly, the same way the design-system editor calls
// GitHub. The trigger URL and token are kept in this browser only (localStorage).
const SETTINGS_KEY = 'tds-protostudio-settings';
const FLOW_FIELDS = ['mode', 'briefUrl', 'briefContent', 'briefTitle', 'selectedOption', 'screenIndexes', 'referenceScreens'];
const TDS_CSS = 'https://richardcollins-pixel.github.io/thoughtful-design-system/tds/tds.css';

function settings() { try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; } catch (_) { return {}; } }

async function post(url, token, agentInput) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(url, { method: 'POST', headers, body: JSON.stringify({ agentInput }) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error('Pipedream returned ' + res.status);
  return { status: res.status, data };
}

let timer = null;
async function call(payload, label, opts = {}) {
  const s = settings();
  if (!s.triggerUrl) { openSettings(); status('Add the trigger URL in Settings first.', true); return null; }
  const started = Date.now();
  clearInterval(timer);
  const tick = () => status(label + ' · ' + Math.floor((Date.now() - started) / 1000) + 's');
  if (label) { tick(); timer = setInterval(tick, 1000); }   // parallel requests pass no label and show no timer
  try {
    const agentInput = {};
    FLOW_FIELDS.forEach(k => { if (k in payload) agentInput[k] = payload[k]; });
    // Ask the flow to hold this request open until the result is ready (one Pipedream run).
    // A flow that doesn't know this flag answers "processing" and the page falls back to checking.
    agentInput.waitForResult = opts.wait !== false;
    const first = await post(s.triggerUrl, s.token, agentInput);
    let result = first.data;
    if (first.status === 202 && first.data.jobId) {
      // Directions and wireframes return a job id; poll the flow's get-job mode until it finishes.
      const deadline = Date.now() + 15 * 60 * 1000;   // longer than a Pipedream step can run
      result = null;
      // Each status check is a separate Pipedream run, so check slowly: 10s, backing off to 30s.
      let wait = 10000;
      while (Date.now() < deadline) {
        await new Promise(r => setTimeout(r, wait));
        wait = Math.min(wait * 1.5, 30000);
        const poll = await post(s.triggerUrl, s.token, { mode: 'get-job', jobId: first.data.jobId });
        if (poll.data.status === 'complete') { result = poll.data.result || poll.data; break; }
        if (poll.data.status === 'error') throw new Error(poll.data.error || 'job failed');
      }
      if (!result) throw new Error('job did not finish in 15 minutes');
    }
    clearInterval(timer);
    return result;
  } catch (e) {
    clearInterval(timer);
    lastCallError = e.message;
    status('Failed: ' + e.message, true);
    return null;
  }
}

// ── settings ─────────────────────────────────────────────────────────────────
function openSettings() {
  const s = settings();
  $('setUrl').value = s.triggerUrl || '';
  $('setToken').value = s.token || '';
  $('setSaveUrl').value = s.saveUrl || '';
  $('setScrim').classList.add('open');
}
$('settingsBtn').onclick = openSettings;
$('setClose').onclick = () => $('setScrim').classList.remove('open');
$('setSave').onclick = () => {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify({
    triggerUrl: $('setUrl').value.trim(), token: $('setToken').value.trim(), saveUrl: $('setSaveUrl').value.trim(),
  }));
  $('setScrim').classList.remove('open');
  status('Settings saved');
};

// ── sharing ──────────────────────────────────────────────────────────────────
// A project is saved to the public wireframe-projects repo as separate files: meta.json, then one
// direction-<n>.json per direction. Each part is its own request to the flow, so none is too big to send.
// Share saves the open prototype, then copies a link with ?p=<id>. Opening the link reads the files from GitHub.
const PROJECTS_RAW = 'https://raw.githubusercontent.com/richardcollins-pixel/wireframe-projects/main/projects/';
const newProjectId = () => 'proj_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

// Sends one file of a project to the flow. Files go one at a time, so a failure names the file.
async function savePart(s, projectId, file, data) {
  const { data: res } = await post(s.saveUrl, s.token, { mode: 'save-project-part', projectId, file, data });
  if (!res.saved) throw new Error((res.error || 'no confirmation') + ' (' + file + ')');
}

// Saves the whole open prototype: meta.json, then one file per screen (d<direction>-s<screen>.json).
// One screen per request keeps every request small enough to send.
async function saveProject(p) {
  const s = settings();
  if (!s.saveUrl) { openSettings(); throw new Error('add the save flow URL in Settings first'); }
  const projectId = p.shareId || newProjectId();
  const dirs = p.directions || [];
  const meta = {
    title: p.title || '', brief: p.brief || {}, savedAt: new Date().toISOString(),
    directions: dirs.map(d => ({
      name: d.name || '', description: d.description || '', device: d.device || '',
      failed: !!d.failed, error: d.error || '', screenCount: (d.screens || []).length,
    })),
  };
  const files = [['meta.json', meta]];
  dirs.forEach((d, i) => (d.screens || []).forEach((scr, j) => files.push(['d' + i + '-s' + j + '.json', scr])));
  for (let k = 0; k < files.length; k++) {
    const [file, data] = files[k];
    status('Saving ' + (k + 1) + ' of ' + files.length + ' (' + Math.round(JSON.stringify(data).length / 1024) + ' KB)…');
    await savePart(s, projectId, file, data);
  }
  p.shareId = projectId; save();
  return projectId;
}

$('shareBtn').onclick = async () => {
  const p = cur();
  try {
    const projectId = await saveProject(p);
    const url = location.origin + location.pathname + '?p=' + projectId;
    await navigator.clipboard.writeText(url).catch(() => {});
    status('Link copied: ' + url);
  } catch (e) { status('Could not save the link: ' + e.message, true); }
};

// Opens a shared prototype when the page is loaded with ?p=<id>.
async function openShared() {
  const projectId = new URLSearchParams(location.search).get('p');
  if (!projectId) return;
  // Always fetch the saved project, so a link shows the latest version rather than an old local copy.
  status('Opening shared prototype…');
  try {
    const read = async (file) => {
      const res = await fetch(PROJECTS_RAW + projectId + '/' + file + '.json', { cache: 'no-store' });
      if (!res.ok) throw new Error(file + ' not found (' + res.status + ')');
      return res.json();
    };
    const meta = await read('meta');
    const directions = [];
    for (let i = 0; i < meta.directions.length; i++) {
      const m = meta.directions[i];
      const screens = [];
      for (let j = 0; j < m.screenCount; j++) screens.push(await read('d' + i + '-s' + j));
      directions.push({ name: m.name, description: m.description, device: m.device, failed: m.failed, error: m.error, screens });
    }
    const p = { id: 'p' + Date.now(), shareId: projectId, title: meta.title, brief: meta.brief, directions };
    db.prototypes = db.prototypes.filter(x => x.shareId !== projectId);
    db.prototypes.unshift(p); save(); openProto(p.id); status('Opened shared prototype');
  } catch (e) { status('Could not open that link: ' + e.message, true); }
}

// ── workspace ────────────────────────────────────────────────────────────────
let fittedFor = null;   // the prototype whose canvas has been fitted to the window
function openProto(id) {
  current = id;
  fittedFor = null;
  render();
}

function render() {
  if (!current || !cur()) { renderLibrary(); return; }
  const p = cur();
  $('library').style.display = 'none';
  $('ws').style.display = 'block';
  $('back').style.display = '';
  $('back').onclick = () => { current = null; render(); };
  $('brand').style.display = 'none';
  $('projectBar').style.display = 'flex';
  $('projName').value = p.title || '';
  $('projName').onchange = () => { p.title = $('projName').value.trim() || 'Untitled prototype'; save(); };
  $('projDelete').onclick = () => deleteProto(p);
  renderCanvas(p);
}

function deleteProto(p) {
  if (busy[p.id]) { status('Wait for the current generation to finish, then delete.', true); return; }
  if (!confirm('Delete "' + (p.title || 'Untitled prototype') + '"? This cannot be undone.')) return;
  db.prototypes = db.prototypes.filter(x => x.id !== p.id);
  current = null;
  save(); status('Project deleted'); render();
}

// ── canvas ───────────────────────────────────────────────────────────────────
// Every direction is one row on the same surface, with its screens side by side at their real size.
// Zoom: ⌘/Ctrl + scroll (or pinch), or the buttons. Pan: scroll, or drag the background.
let view = { x: 40, y: 40, z: 0.5 };
const ZOOM_MIN = 0.1, ZOOM_MAX = 2;

function applyView() {
  $('world').style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
  $('zLevel').textContent = Math.round(view.z * 100) + '%';
}

// Zooms around a point in the viewport, so the spot under the cursor stays put.
function zoomAt(mx, my, nz) {
  nz = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, nz));
  view.x = mx - (mx - view.x) * (nz / view.z);
  view.y = my - (my - view.y) * (nz / view.z);
  view.z = nz;
  applyView();
}

function viewportCenter() {
  const vp = $('vp');
  return { x: vp.clientWidth / 2, y: vp.clientHeight / 2 };
}

// Shows all the content at a zoom that fits the window.
function fitView() {
  const vp = $('vp'), world = $('world');
  if (!world.offsetWidth || !world.offsetHeight) return;
  const pad = 40;
  const z = Math.min(1, (vp.clientWidth - pad * 2) / world.offsetWidth, (vp.clientHeight - pad * 2) / world.offsetHeight);
  view = { x: pad, y: pad, z: Math.max(ZOOM_MIN, z) };
  applyView();
}

function renderCanvas(p) {
  const dev = deviceOf(p);
  const size = SIZES[dev];
  const rows = (p.directions || []).map((d, i) => {
    const cards = (d.screens || []).map(s => screenCard(s, size)).join('');
    const note = d.failed
      ? `<div class="busy">Some screens did not finish${d.error ? ': ' + esc(d.error) : ''}. <button data-retry="${i}">Retry</button></div>`
      : '';
    return `<section class="row">
      <div class="row-head"><h3>${esc(d.name || 'Direction ' + (i + 1))}</h3><p>${esc(d.description || '')}</p>${note}</div>
      <div class="row-screens">${cards}</div>
    </section>`;
  }).join('');
  // Until the directions arrive, show the layout as skeletons: three rows of screen placeholders.
  const pending = !p.directions.length && busy[p.id]
    ? [0, 1, 2].map(() => `<section class="row">
        <div class="row-head"><div class="skel-bar" style="width:220px;height:14px"></div><div class="skel-bar" style="width:420px;margin-top:10px"></div></div>
        <div class="row-screens">${[0, 1, 2, 3].map(() => `<div class="screen" style="width:${size.w}px"><div class="skel" style="width:${size.w}px;height:${size.h}px"></div><div class="skel-bar" style="width:160px;margin-top:4px"></div></div>`).join('')}</div>
      </section>`).join('')
    : '';
  const empty = p.directions.length || busy[p.id] ? '' : `<div class="busy" style="padding:40px">No directions yet.</div>`;
  $('world').innerHTML = pending + empty + rows;
  $('world').querySelectorAll('[data-retry]').forEach(b => b.onclick = () => retryDirection(p, Number(b.dataset.retry)));

  // Fit the canvas to the window the first time a prototype's content appears.
  if (fittedFor !== p.id && p.directions.length) { fitView(); fittedFor = p.id; }
  else applyView();
}

function screenCard(s, size) {
  const body = s.html
    ? `<div class="frame" style="width:${size.w}px;height:${size.h}px"><iframe sandbox="allow-scripts" style="width:${size.w}px;height:${size.h}px" srcdoc="${esc(srcdoc(s))}"></iframe></div>`
    : `<div class="skel" style="width:${size.w}px;height:${size.h}px"></div>`;
  return `<div class="screen" style="width:${size.w}px">
      ${body}
      <div class="label">${esc(s.name || 'Screen')}</div>
      <div class="purpose">${esc(s.description || s.purpose || '')}</div></div>`;
}

// Wheel: scroll pans, ⌘/Ctrl + wheel (or a trackpad pinch) zooms.
$('vp').addEventListener('wheel', (e) => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) {
    const r = $('vp').getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, view.z * Math.exp(-e.deltaY * 0.01));
  } else {
    view.x -= e.deltaX; view.y -= e.deltaY; applyView();
  }
}, { passive: false });

// Drag the background to pan.
let drag = null;
$('vp').addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
  $('vp').classList.add('dragging');
  $('vp').setPointerCapture(e.pointerId);
});
$('vp').addEventListener('pointermove', (e) => {
  if (!drag) return;
  view.x = drag.vx + (e.clientX - drag.x);
  view.y = drag.vy + (e.clientY - drag.y);
  applyView();
});
const endDrag = () => { drag = null; $('vp').classList.remove('dragging'); };
$('vp').addEventListener('pointerup', endDrag);
$('vp').addEventListener('pointercancel', endDrag);

$('zIn').onclick = () => { const c = viewportCenter(); zoomAt(c.x, c.y, view.z * 1.25); };
$('zOut').onclick = () => { const c = viewportCenter(); zoomAt(c.x, c.y, view.z / 1.25); };
$('zLevel').onclick = () => { const c = viewportCenter(); zoomAt(c.x, c.y, 1); };
$('zFit').onclick = fitView;

// ── screen HTML ──────────────────────────────────────────────────────────────
// Screens arrive as full HTML documents. Add the design-system stylesheet to them; if a screen is only
// a fragment, wrap it in a page first.
function srcdoc(screen) {
  // Relative image and font paths in the design system resolve against the design system's own site.
  const head = `<base href="https://richardcollins-pixel.github.io/thoughtful-design-system/tds/">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="${TDS_CSS}">
<style>html,body{margin:0;min-height:100%}</style>`;
  const html = screen.html || '';
  // Charcoal (wireframe) fidelity: accent colours and imagery drop out and gradients flatten, so screens read as wireframes.
  const fidelity = 'data-fidelity="wireframe"';
  const isDoc = /<html[\s>]/i.test(html);
  const body = isDoc
    ? html.replace(/<html([^>]*)>/i, (m, attrs) => `<html${attrs} ${fidelity}>`)
        .replace(/<head[^>]*>/i, m => m + head).replace(/<\/body>/i, '<!--wa-->')
    : `<!doctype html><html ${fidelity}><head><meta charset="utf-8">${head}</head><body>${html}<!--wa--></body></html>`;
  return body.replace('<!--wa-->', BLOB_SCRIPT);
}

// The blob (T) is drawn by the design system's behaviors/blob.js. It sizes its canvas and places the glow from
// the page's layout when it starts, so it waits for the window's load event, after the stylesheet has applied.
// A module script does not wait for the stylesheet, and an unstyled canvas measures 300 × 150.
const BLOB_SCRIPT = `<script type="module">
  window.addEventListener('load', () => { if (document.querySelector('.blob, .glow')) import('./behaviors/blob.js'); });
<\/script>`;

load().then(() => { render(); openShared(); });
</script>
</body>
</html>
