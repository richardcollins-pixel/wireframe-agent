<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tds ProtoStudio</title>
<style>
  :root {
    --ink: #111114; --mute: #8a8a92; --line: #e4e4e8; --soft: #f5f5f7; --pink: #d6336c;
    font-family: Inter, system-ui, sans-serif; font-size: 13px; color: var(--ink);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f7f7f8; height: 100vh; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 12px; }
  button:hover { background: var(--soft); }
  button.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
  button.dark:hover { background: #2b2b33; }
  button:disabled { opacity: .4; cursor: default; }
  input, select, textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink); }

  .top { height: 56px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 20px; gap: 12px; }
  .brand { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
  .brand span { color: var(--pink); }
  .top .status { margin-left: auto; color: var(--mute); font-size: 12px; }
  .top .status.err { color: #c0392b; }

  /* library */
  .library { padding: 32px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; align-content: start; overflow: auto; height: calc(100vh - 56px); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; min-height: 200px; }
  .card:hover { border-color: #ccc; }
  .card .thumb { height: 120px; flex: 0 0 120px; background: linear-gradient(160deg, #6b2d8a, #2a0e4a); }
  .card .thumb.blank { background: var(--soft); }
  .card .body { flex: 1 1 auto; padding: 12px 14px; color: var(--ink); display: block; }
  .card h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.3; }
  .card .status { margin: 0; color: var(--mute); font-size: 12px; line-height: 1.45; }
  .card.new { border: 1px dashed #c8c8d0; background: transparent; display: flex; align-items: center; justify-content: center; min-height: 220px; color: var(--mute); }

  /* modal */
  .scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .35); display: none; align-items: center; justify-content: center; z-index: 10; }
  .scrim.open { display: flex; }
  .modal { background: #fff; border-radius: 16px; width: 400px; padding: 28px; box-shadow: 0 20px 60px rgb(0 0 0 / .2); }
  .modal h2 { font-size: 17px; margin: 0 0 20px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .modal h2 button { border: 0; background: none; padding: 0 4px; font-size: 18px; color: var(--mute); }
  .modal label { display: block; color: var(--mute); font-size: 12px; margin: 14px 0 6px; }
  .modal .foot { margin-top: 22px; }
  .modal .foot button { width: 100%; padding: 11px; }
  .modal .err { color: #c0392b; margin-top: 10px; min-height: 16px; font-size: 12px; }

  /* workspace */
  .ws { display: grid; grid-template-columns: 240px 1fr 300px; height: calc(100vh - 56px); }
  .ws > section { min-height: 0; overflow: auto; }
  .left { background: #fff; border-right: 1px solid var(--line); padding: 18px 14px; }
  .left h4 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
  .left .hint { color: var(--mute); font-size: 12px; margin-bottom: 14px; line-height: 1.45; }
  .dir { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; cursor: pointer; }
  .dir.active { border-color: var(--ink); }
  .dir h5 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
  .dir p { margin: 0 0 8px; color: var(--mute); font-size: 12px; line-height: 1.4; }
  .dir .opts { display: flex; gap: 12px; font-size: 12px; color: var(--mute); }
  .dir .opts label { display: flex; align-items: center; gap: 4px; cursor: pointer; }

  .center { padding: 16px 20px; display: flex; flex-direction: column; min-height: 0; }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .toolbar select { width: auto; padding: 6px 8px; }
  .toolbar .size { color: var(--mute); font-size: 12px; }
  .tabs { margin-left: auto; display: inline-flex; background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .tabs button { border: 0; border-radius: 0; background: #fff; }
  .tabs button.on { background: var(--ink); color: #fff; }
  .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; overflow: auto; }
  .stage .name { color: var(--mute); margin-bottom: 8px; font-size: 12px; }
  .frame { background: #fff; border-radius: 22px; border: 1px solid var(--line); overflow: hidden; position: relative; box-shadow: 0 6px 24px rgb(0 0 0 / .06); }
  .frame iframe { border: 0; transform-origin: 0 0; display: block; background: #fff; }
  .frame.target { outline: 2px solid #0d99ff; outline-offset: 3px; }
  .pager { display: flex; align-items: center; gap: 12px; margin-top: 12px; color: var(--mute); }
  .screens-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; width: 100%; }
  .screens-grid .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
  .screens-grid .cell span { color: var(--mute); font-size: 12px; }
  .busy { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--mute); text-align: center; line-height: 1.6; }

  .right { background: #fff; border-left: 1px solid var(--line); padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
  .right h4 { margin: 0; font-size: 13px; font-weight: 600; }
  .chip { display: inline-block; background: var(--soft); border-radius: 6px; padding: 5px 8px; font-size: 12px; color: var(--mute); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip b { color: var(--ink); font-weight: 600; }
  .target-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--mute); }
  .comments { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .c { border-left: 2px solid var(--line); padding: 6px 8px; font-size: 12px; line-height: 1.4; }
  .c .where { color: var(--mute); font-size: 11px; margin-bottom: 2px; }
  .c button { float: right; border: 0; background: none; padding: 0 2px; color: var(--mute); }
  textarea.ask { height: 88px; resize: vertical; }
  .right .go { width: 100%; padding: 11px; }
.screen-row { display: flex; gap: 16px; overflow-x: auto; align-items: flex-start; padding-bottom: 12px; width: 100%; }
  .screen-card { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; }
  .screen-card .label { font-weight: 600; font-size: 12px; }
  .screen-card .purpose { color: var(--mute); font-size: 12px; line-height: 1.4; width: 100%; margin-top: 2px; }
  .dirhead { margin-bottom: 12px; }
  .dirhead h3 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  .dirhead p { margin: 0; color: var(--mute); }
  .dirblock { margin-bottom: 28px; width: 100%; }
  .skel, .skel-bar { background: linear-gradient(90deg, #ececef 0%, #f6f6f8 50%, #ececef 100%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 8px; }
  .skel-bar { height: 10px; }
  .skel { border-radius: 16px; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  /* radio buttons keep their natural size; the global input rule would stretch them across the card */
  .dir input[type="radio"] { width: auto; padding: 0; margin: 0; border: 0; background: none; }
</style>
</head>
<body>

<div class="top">
  <button id="back" style="display:none">←</button>
  <div class="brand" id="brand">tds <span>Proto</span>Studio</div>
  <div id="projectBar" style="display:none;align-items:center;gap:8px">
    <input id="projName" style="width:320px;font-weight:600" aria-label="Project name">
    <button id="projDelete" title="Delete project" aria-label="Delete project" style="padding:7px 10px;display:flex;align-items:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
  </div>
  <div class="status" id="status"></div>
  <button id="settingsBtn">Settings</button>
  <button class="dark" id="newBtn">New Prototype</button>
</div>

<div id="library" class="library"></div>

<div class="ws" id="ws" style="display:none">
  <section class="left" id="left"></section>
  <section class="center" id="center"></section>
  <section class="right" id="right"></section>
</div>

<div class="scrim" id="setScrim">
  <div class="modal">
    <h2>Settings <button id="setClose">×</button></h2>
    <label for="setUrl">Pipedream trigger URL</label>
    <input id="setUrl" placeholder="https://….m.pipedream.net">
    <label for="setToken">Token (only if the trigger requires one)</label>
    <input id="setToken" type="password" placeholder="Optional">
    <div class="foot"><button class="dark" id="setSave">Save</button></div>
    <div class="err">Saved in this browser only. Nothing is stored in the repo.</div>
  </div>
</div>

<div class="scrim" id="scrim">
  <div class="modal">
    <h2>1. Generate Design Directions <button id="close">×</button></h2>
    <label for="mSpec">Spec Sheet</label>
    <input id="mSpec" placeholder="Confluence link">
    <label for="mText">…or paste the brief</label>
    <textarea id="mText" rows="3" placeholder="Brief text (used when there's no link)" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical"></textarea>
    <div class="foot"><button class="dark" id="mGo">Generate Design Directions</button></div>
    <div class="err" id="mErr"></div>
  </div>
</div>

<script>
const KEY = 'tds-protostudio-v1';
const SIZES = { desktop: { w: 1280, h: 800, scale: 0.6, label: 'Desktop' }, mobile: { w: 390, h: 874, scale: 0.72, label: 'Mobile' } };

// ── state ────────────────────────────────────────────────────────────────────
// A prototype: { id, title, brief, directions:[{name,description,screens}], lead, included:[], prototype:null, comments:[], view }
let db = { prototypes: [] };
let current = null;          // id of the open prototype, or null for the library
let busy = {};
let synthesizing = null;
let lastCallError = '';   // the reason the most recent request failed   // id of the prototype being synthesized, if any               // id -> true while a generation runs
let target = null;           // { level, screenId, screenName, directionName, elementId, elementTag, elementText }
let shown = { tab: 'screens', index: 0, device: 'auto', dir: null };

function save() { localStorage.setItem(KEY, JSON.stringify(db)); }
function load() { try { db = JSON.parse(localStorage.getItem(KEY)) || db; } catch (_) {} }
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const getProto = (id) => db.prototypes.find(p => p.id === id);
// The flow names a screen with `title` in some outputs and `name` in others.
const withName = (s) => ({ ...s, name: s.name || s.title || 'Screen' });
const cur = () => getProto(current);

function status(text, isErr) { const s = $('status'); s.textContent = text; s.classList.toggle('err', !!isErr); }

// ── library ──────────────────────────────────────────────────────────────────
function renderLibrary() {
  $('ws').style.display = 'none';
  $('library').style.display = 'grid';
  $('back').style.display = 'none';
  $('projectBar').style.display = 'none';
  $('brand').style.display = '';
  const cards = db.prototypes.map(p => `
    <div class="card" data-open="${p.id}">
      <div class="thumb ${p.directions.length ? '' : 'blank'}">${p.directions.length ? '' : ''}</div>
      <div class="body"><h3>${esc(p.title || 'Untitled prototype')}</h3>
        <p class="status">${busy[p.id] ? 'Generating directions…' : (p.directions.length ? p.directions.length + ' directions' : 'Not generated')}</p></div>
    </div>`).join('');
  $('library').innerHTML = cards + `<div class="card new" id="newCard">+ New prototype</div>`;
  $('library').querySelectorAll('[data-open]').forEach(c => c.onclick = () => openProto(c.dataset.open));
  $('newCard').onclick = openModal;
}

// ── generate form ────────────────────────────────────────────────────────────
function openModal() { $('mErr').textContent = ''; $('scrim').classList.add('open'); }
function closeModal() { $('scrim').classList.remove('open'); }
$('newBtn').onclick = openModal;
$('close').onclick = closeModal;
$('scrim').onclick = (e) => { if (e.target === $('scrim')) closeModal(); };

$('mGo').onclick = async () => {
  const brief = { briefUrl: $('mSpec').value.trim(), briefContent: $('mText').value.trim() };
  if (!brief.briefUrl && !brief.briefContent) { $('mErr').textContent = 'Add a spec sheet link or paste the brief.'; return; }
  const p = { id: 'p' + Date.now(), title: '', brief, directions: [], lead: 0, prototype: null, comments: [], versions: [] };
  db.prototypes.unshift(p); save();
  closeModal();
  openProto(p.id);
  busy[p.id] = true; render();

  // 1. The content designer writes the three directions: names, descriptions, screen titles and purposes.
  const data = await call({ mode: 'directions', ...brief }, 'Writing directions');
  if (!data) { busy[p.id] = false; render(); return; }
  p.title = data.title || 'Untitled prototype';
  p.directions = (data.directions || []).map(d => ({
    ...d, name: d.title || d.name || '', screens: (d.screens || []).map(withName),
  }));
  // The content designer chooses each direction's device. If they agree, the view follows them.
  const devices = [...new Set(p.directions.map(d => d.device).filter(Boolean))];
  if (devices.length === 1) shown.device = devices[0];
  save(); status('Designing screens'); render();

  // 2. The wireframe designer designs each direction as its own request, so screens fill in as each one finishes.
  await Promise.all(p.directions.map(d => designDirection(p, d)));
  busy[p.id] = false;
  const failed = p.directions.filter(d => d.failed).length;
  save();
  status(failed ? failed + ' direction' + (failed > 1 ? 's' : '') + ' did not finish. Use Retry in the screens view.' : 'Directions ready', failed > 0);
  render();
};

// Designs one direction in two batches. The second batch is given the first batch's designs,
// so the screens keep the same look. Each request stays short enough to finish.
async function designDirection(p, d, onlyFailed = false) {
  const outline = (d.screens || []).slice();
  const all = outline.map((_, i) => i);
  const half = Math.ceil(outline.length / 2);
  const batches = [all.slice(0, half), all.slice(half)].filter(b => b.length);
  // Each request sends the direction's outline without the HTML, plus the screens to design.
  const brief = { name: d.name, description: d.description, device: d.device,
    screens: outline.map(({ html, ...rest }) => rest) };
  let error = '';
  for (const indexes of batches) {
    const needed = !onlyFailed || indexes.some(i => !d.screens[i]?.html || d.screens[i].failed);
    if (!needed) continue;
    // The designs so far, so this batch matches their look.
    const reference = d.screens.filter(s => s && s.html && !s.failed)
      .map(({ name, title, html }) => ({ name: name || title, html }));
    const out = await call({ mode: 'wireframes', ...p.brief, selectedOption: brief,
      screenIndexes: indexes, referenceScreens: reference }, null, { wait: false });
    if (out && out.screens) {
      indexes.forEach((i, k) => {
        const got = out.screens[k];
        d.screens[i] = got
          ? { ...got, id: outline[i].id || got.id, name: outline[i].name, failed: false }
          : { ...outline[i], failed: true };
      });
    } else {
      error = lastCallError;
      indexes.forEach(i => { d.screens[i] = { ...outline[i], failed: true }; });
    }
    save(); render();
  }
  d.failed = d.screens.some(x => x && x.failed);
  d.error = d.failed ? error : '';
  save(); render();
}

// Retries one direction after it failed.
async function retryDirection(p, i) {
  const d = p.directions[i];
  if (!d || busy[p.id]) return;
  busy[p.id] = true; render();
  await designDirection(p, d, true);
  busy[p.id] = false;
  const failed = p.directions.filter(x => x.failed).length;
  save();
  status(failed ? failed + ' still failing. Try again.' : 'Directions ready', failed > 0);
  render();
}

// ── api ──────────────────────────────────────────────────────────────────────
// The page calls the Pipedream trigger directly, the same way the design-system editor calls
// GitHub. The trigger URL and token are kept in this browser only (localStorage).
const SETTINGS_KEY = 'tds-protostudio-settings';
const FLOW_FIELDS = ['mode', 'briefUrl', 'briefContent', 'briefTitle', 'selectedOption', 'selectedDirections', 'direction', 'screenComments', 'generalComment'];
const TDS_CSS = 'https://richardcollins-pixel.github.io/thoughtful-design-system/tds/tds.css';

function settings() { try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; } catch (_) { return {}; } }

// Flow output is either flat (directions) or wrapped as {output: {screens}} (build, iterate).
function normalize(result) {
  if (result && result.output && typeof result.output === 'object') {
    return { ...result.output, mode: result.mode, featureTitle: result.featureTitle };
  }
  return result;
}

async function post(url, token, agentInput) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(url, { method: 'POST', headers, body: JSON.stringify({ agentInput }) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error('Pipedream returned ' + res.status);
  return { status: res.status, data };
}

let timer = null;
async function call(payload, label, opts = {}) {
  const s = settings();
  if (!s.triggerUrl) { openSettings(); status('Add the trigger URL in Settings first.', true); return null; }
  const started = Date.now();
  clearInterval(timer);
  const tick = () => status(label + ' · ' + Math.floor((Date.now() - started) / 1000) + 's');
  if (label) { tick(); timer = setInterval(tick, 1000); }   // parallel requests pass no label and show no timer
  try {
    const agentInput = {};
    FLOW_FIELDS.forEach(k => { if (k in payload) agentInput[k] = payload[k]; });
    // Ask the flow to hold this request open until the result is ready (one Pipedream run).
    // A flow that doesn't know this flag answers "processing" and the page falls back to checking.
    agentInput.waitForResult = opts.wait !== false;
    const first = await post(s.triggerUrl, s.token, agentInput);
    let result = first.data;
    if (first.status === 202 && first.data.jobId) {
      // Directions, build and iterate return a job id; poll the flow's get-job mode until it finishes.
      const deadline = Date.now() + 15 * 60 * 1000;   // longer than a Pipedream step can run
      result = null;
      // Each status check is a separate Pipedream run, so check slowly: 10s, backing off to 30s.
      let wait = 10000;
      while (Date.now() < deadline) {
        await new Promise(r => setTimeout(r, wait));
        wait = Math.min(wait * 1.5, 30000);
        const poll = await post(s.triggerUrl, s.token, { mode: 'get-job', jobId: first.data.jobId });
        if (poll.data.status === 'complete') { result = poll.data.result || poll.data; break; }
        if (poll.data.status === 'error') throw new Error(poll.data.error || 'job failed');
      }
      if (!result) throw new Error('job did not finish in 15 minutes');
    }
    clearInterval(timer);
    return normalize(result);
  } catch (e) {
    clearInterval(timer);
    lastCallError = e.message;
    status('Failed: ' + e.message, true);
    return null;
  }
}

// ── settings ─────────────────────────────────────────────────────────────────
function openSettings() {
  const s = settings();
  $('setUrl').value = s.triggerUrl || '';
  $('setToken').value = s.token || '';
  $('setScrim').classList.add('open');
}
$('settingsBtn').onclick = openSettings;
$('setClose').onclick = () => $('setScrim').classList.remove('open');
$('setSave').onclick = () => {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify({ triggerUrl: $('setUrl').value.trim(), token: $('setToken').value.trim() }));
  $('setScrim').classList.remove('open');
  status('Settings saved');
};

// ── workspace ────────────────────────────────────────────────────────────────
function openProto(id) {
  current = id;
  const p = cur();
  if (!p.view) p.view = {};
  target = null;
  shown = { tab: 'screens', index: 0, device: 'auto', dir: null };
  render();
}

// The screens on show: the synthesized prototype if there is one, otherwise the lead direction.
// What the centre shows: the prototype once it exists; otherwise the direction being viewed (the lead by default).
function sourceScreens(p) {
  if (p.prototype) return { name: 'Prototype', screens: p.prototype.screens, index: -1 };
  const i = shown.dir ?? p.lead;
  const d = p.directions[i];
  return d ? { name: d.name, screens: d.screens || [], index: i } : { name: '', screens: [], index: -1 };
}

function render() {
  if (!current || !cur()) { renderLibrary(); return; }
  const p = cur();
  $('library').style.display = 'none';
  $('ws').style.display = 'grid';
  $('back').style.display = '';
  $('back').onclick = () => { current = null; target = null; render(); };
  $('brand').style.display = 'none';
  $('projectBar').style.display = 'flex';
  $('projName').value = p.title || '';
  $('projName').onchange = () => { p.title = $('projName').value.trim() || 'Untitled prototype'; save(); };
  $('projDelete').onclick = () => deleteProto(p);
  // Stage one: directions on the left. Once there is a prototype, the left shows its history instead.
  if (p.prototype) renderHistory(p); else renderLeft(p);
  renderCenter(p);
  renderRight(p);
}

function renderLeft(p) {
  const viewing = shown.dir ?? p.lead;
  if (!p.directions.length) {
    // Skeleton while the directions are being written.
    $('left').innerHTML = `<h4>Directions</h4>
      <div class="hint">Writing three directions for this brief.</div>
      ${[0, 1, 2].map(() => '<div class="dir"><div class="skel-bar" style="width:70%"></div><div class="skel-bar" style="width:100%;margin-top:8px"></div><div class="skel-bar" style="width:85%;margin-top:6px"></div></div>').join('')}`;
    return;
  }
  const dirs = p.directions.map((d, i) => `
    <div class="dir ${i === viewing ? 'active' : ''}" data-dir="${i}">
      <h5>${esc(d.name || 'Direction ' + (i + 1))}</h5>
      <p>${esc(d.description || '')}</p>
      <label class="opts" style="cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;margin-top:8px"><input type="radio" name="lead" data-lead="${i}" ${i === p.lead ? 'checked' : ''}> Lead direction</label>
    </div>`).join('');
  $('left').innerHTML = `<h4>Directions</h4>
    <div class="hint">Pick a lead direction. Click any direction to view it, then comment on screens or elements from other directions to bring them in.</div>
    ${dirs}`;
  $('left').querySelectorAll('[data-lead]').forEach(r => r.onchange = () => { p.lead = Number(r.dataset.lead); save(); render(); });
  $('left').querySelectorAll('[data-dir]').forEach(el => el.onclick = (e) => {
    if (e.target.closest('input')) return;
    shown = { ...shown, dir: Number(el.dataset.dir), index: 0 };
    target = null; render();
  });
}

function renderHistory(p) {
  const history = (p.versions || []).map((v, i) => `<div class="c">
      <div class="where">${esc(new Date(v.at).toLocaleTimeString())}</div>${esc(v.label)}
      <div style="margin-top:4px">${i === 0 ? '<span class="chip">current</span>' : `<button data-restore="${i}">Restore</button>`}</div></div>`).join('');
  $('left').innerHTML = `<h4>History</h4>
    <div class="hint">Every change is saved. Restore any version.</div>
    ${history || '<div class="chip">No versions yet</div>'}`;
  $('left').querySelectorAll('[data-restore]').forEach(b => b.onclick = () => restoreVersion(p, Number(b.dataset.restore)));
}

// Frame sizes for the screens row: each screen is drawn at this width and scaled to fit.
const CARD = {
  mobile:  { w: 260, h: 583, scale: 260 / 390 },
  desktop: { w: 832, h: 520, scale: 520 / 800 },   // 520px tall, same 1280 × 800 proportions
};

function screenCard(s, forced, dirDevice) {
  // Priority: a manual choice, then the device the content designer chose for the direction, then the screen's own.
  const dev = forced || dirDevice || (s.device === 'desktop' ? 'desktop' : 'mobile');
  const c = CARD[dev];
  const body = s.html
    ? `<div class="frame ${target && target.screenId === s.id ? 'target' : ''}" style="width:${c.w}px;height:${c.h}px">${frame(s, dev, c.scale)}</div>`
    : `<div class="skel" style="width:${c.w}px;height:${c.h}px"></div>`;
  return `<div class="screen-card" style="width:${c.w}px">
      ${body}
      <div class="label">${esc(s.name || 'Screen')}</div>
      <div class="purpose">${esc(s.description || s.purpose || '')}</div></div>`;
}

function skeletonDirection(dev) {
  const c = CARD[dev];
  const cards = [0, 1, 2].map(() => `<div class="screen-card">
      <div class="skel-bar" style="width:120px"></div>
      <div class="skel" style="width:${c.w}px;height:${c.h}px;margin-top:6px"></div>
      <div class="skel-bar" style="width:200px;margin-top:8px"></div></div>`).join('');
  return `<div class="dirblock"><div class="skel-bar" style="width:200px;height:14px"></div>
    <div class="skel-bar" style="width:320px;margin-top:8px"></div>
    <div class="screen-row">${cards}</div></div>`;
}

function renderCenter(p) {
  const forced = shown.device === 'mobile' || shown.device === 'desktop' ? shown.device : null;
  const dev = forced || 'mobile';
  const size = SIZES[dev];
  const toolbar = `<div class="toolbar">
      <select id="device"><option value="auto" ${!forced ? 'selected' : ''}>Auto</option><option value="mobile" ${forced === 'mobile' ? 'selected' : ''}>Mobile</option><option value="desktop" ${forced === 'desktop' ? 'selected' : ''}>Desktop</option></select>
      <span class="size">${forced ? size.w + ' × ' + size.h : 'each screen its own size'}</span>
      <div class="tabs"><button data-tab="screens" class="${shown.tab === 'screens' ? 'on' : ''}">Screens</button><button data-tab="prototype" class="${shown.tab === 'prototype' ? 'on' : ''}">Prototype</button></div>
    </div>`;

  let body;
  if (!p.directions.length) {
    // Skeleton until the directions copy arrives.
    body = [0, 1, 2].map(() => skeletonDirection(dev)).join('');
  } else if (shown.tab === 'screens' && synthesizing === p.id && !p.prototype) {
    // Synthesis in progress: show the flow being built, not the direction being viewed.
    const lead = p.directions[p.lead];
    body = `<div class="dirhead"><h3>Synthesizing ${esc(lead?.name || '')}</h3><p>Building one flow from the lead and the comments on every direction.</p></div>
      <div class="screen-row">${[0, 1, 2].map(() => `<div class="screen-card"><div class="skel" style="width:${CARD[dev].w}px;height:${CARD[dev].h}px"></div></div>`).join('')}</div>`;
  } else if (shown.tab === 'screens') {
    const src = sourceScreens(p);
    const head = p.prototype
      ? `<div class="dirhead"><h3>Prototype</h3><p>${src.screens.length} screens</p></div>`
      : `<div class="dirhead"><h3>${esc(src.name)}</h3><p>${esc(p.directions[src.index]?.description || '')}</p></div>`;
    const cards = src.screens.length
      ? src.screens.map(s => screenCard(s, forced, p.prototype ? null : p.directions[src.index]?.device)).join('')
      : [0, 1, 2].map(() => `<div class="screen-card"><div class="skel" style="width:${CARD[dev].w}px;height:${CARD[dev].h}px"></div></div>`).join('');
    const failedDir = !p.prototype && p.directions[src.index]?.failed;
    const retryNote = failedDir
      ? `<div class="busy">Some screens did not finish${p.directions[src.index]?.error ? ': ' + esc(p.directions[src.index].error) : ''}. <button data-retry="${src.index}">Retry</button></div>`
      : '';
    body = `${head}<div class="screen-row">${cards}</div>${retryNote}`;
  } else {
    const src = sourceScreens(p);
    const screens = src.screens;
    if (!screens.length) { body = '<div class="busy">Designing screens…</div>'; }
    else {
      shown.index = Math.min(Math.max(shown.index, 0), screens.length - 1);
      const s = screens[shown.index];
      const sd = forced || (s.device === 'desktop' ? 'desktop' : 'mobile');
      const ss = SIZES[sd];
      body = `<div class="name">${esc(src.name)} · ${esc(s.name || 'Screen')}</div>
        <div class="frame ${target && target.screenId === s.id ? 'target' : ''}" style="width:${ss.w * ss.scale}px;height:${ss.h * ss.scale}px">${s.html ? frame(s, sd, ss.scale) : ''}</div>
        <div class="pager"><button data-prev>←</button><span>${shown.index + 1} / ${screens.length}</span><button data-next>→</button></div>`;
    }
  }
  $('center').innerHTML = toolbar + `<div class="stage">${body}</div>`;
  $('device').onchange = (e) => { shown.device = e.target.value; render(); };
  $('center').querySelectorAll('[data-retry]').forEach(b => b.onclick = () => retryDirection(p, Number(b.dataset.retry)));
  $('center').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { shown.tab = b.dataset.tab; render(); });
  const prev = $('center').querySelector('[data-prev]'), next = $('center').querySelector('[data-next]');
  const count = sourceScreens(p).screens.length;
  if (prev) prev.onclick = () => { shown.index = Math.max(0, shown.index - 1); render(); };
  if (next) next.onclick = () => { shown.index = Math.min(count - 1, shown.index + 1); render(); };
}

function frame(screen, device, scale) {
  const size = SIZES[device];
  return `<iframe sandbox="allow-scripts" style="width:${size.w}px;height:${size.h}px;transform:scale(${scale})" srcdoc="${esc(srcdoc(screen))}"></iframe>`;
}

// Screens arrive as full HTML documents. Add the design-system stylesheet and the click
// handler to them; if a screen is only a fragment, wrap it in a page first.
function srcdoc(screen) {
  // Relative image and font paths in the design system resolve against the design system's own site.
  const head = `<base href="https://richardcollins-pixel.github.io/thoughtful-design-system/tds/">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="${TDS_CSS}">
<style>
  html,body{margin:0;min-height:100%}
  [data-el]{cursor:pointer}
  .wa-hover{outline:1px dashed #0d99ff!important;outline-offset:2px}
  .wa-sel{outline:2px solid #0d99ff!important;outline-offset:2px}
</style>`;
  const html = screen.html || '';
  // Charcoal (wireframe) fidelity, the same switch the editor's Charcoal toggle sets on its canvas:
  // accent colours and imagery drop out and gradients flatten, so screens read as wireframes.
  const fidelity = 'data-fidelity="wireframe"';
  const isDoc = /<html[\s>]/i.test(html);
  const body = isDoc
    ? html.replace(/<html([^>]*)>/i, (m, attrs) => `<html${attrs} ${fidelity}>`)
        .replace(/<head[^>]*>/i, m => m + head).replace(/<\/body>/i, '<!--wa-->')
    : `<!doctype html><html ${fidelity}><head><meta charset="utf-8">${head}</head><body>${html}<!--wa--></body></html>`;
  return body.replace('<!--wa-->', clickScript(screen.id));
}

function clickScript(screenId) {
  return `<script>
  const SCREEN_ID = ${JSON.stringify(screenId)};
  let hover = null;
  document.addEventListener('mouseover', (e) => {
    const el = e.target.closest('[data-el]');
    if (hover === el) return;
    if (hover) hover.classList.remove('wa-hover');
    if (el) el.classList.add('wa-hover');
    hover = el;
  });
  document.addEventListener('click', (e) => {
    e.preventDefault(); e.stopPropagation();
    const el = e.target.closest('[data-el]');
    document.querySelectorAll('.wa-sel').forEach(n => n.classList.remove('wa-sel'));
    if (el) el.classList.add('wa-sel');
    parent.postMessage({ type: 'wa-target', screenId: SCREEN_ID,
      elementId: el ? el.dataset.el : '', tag: el ? el.tagName.toLowerCase() : '',
      text: el ? (el.textContent || '').trim().slice(0, 160) : '' }, '*');
  }, true);
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'wa-clear') document.querySelectorAll('.wa-sel').forEach(n => n.classList.remove('wa-sel'));
  });
<\/script>`;
}

window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.type !== 'wa-target' || !cur()) return;
  const p = cur();
  const src = sourceScreens(p);
  const screen = src.screens.find(s => s.id === m.screenId);
  if (!screen) return;
  target = {
    level: m.elementId ? 'element' : 'screen',
    screenId: screen.id, screenName: screen.name || '', directionName: src.name, directionIndex: src.index,
    elementId: m.elementId || '', elementTag: m.tag || '', elementText: m.text || '',
  };
  renderRight(p);
});

// Clears the selection inside every screen and in the comment panel.
function clearFrames() {
  document.querySelectorAll('#center iframe').forEach(f => { if (f.contentWindow) f.contentWindow.postMessage({ type: 'wa-clear' }, '*'); });
}

// Clicking the empty canvas (not a screen, not a control) deselects.
$('center').addEventListener('click', (e) => {
  if (e.target.closest('iframe, button, select, input, textarea, label')) return;
  if (!target) return;
  target = null; clearFrames();
  if (cur()) renderRight(cur());
});

// Saves a comment. With no target selected, it applies to the direction being viewed, or the whole flow.
function addComment(p, text) {
  const src = sourceScreens(p);
  p.comments.push({ ...(target || { level: 'prototype', screenName: '', screenId: '', directionName: src.name, directionIndex: src.index }), comment: text });
  target = null; save(); clearFrames();
}

function renderRight(p) {
  const t = target;
  const targetText = !t ? 'Nothing selected'
    : t.level === 'element' ? 'data-el: ' + t.elementId
    : 'Screen: ' + t.screenName;
  const list = p.comments.length
    ? p.comments.map((c, i) => `<div class="c"><button data-remove="${i}">×</button>
        <div class="where">${esc(c.directionName || '')} · ${esc(c.screenName || '')}${c.elementId ? ' · data-el ' + esc(c.elementId) : ''}</div>${esc(c.comment)}</div>`).join('')
    : '<div class="chip">Click a screen or element, then say what to keep or change.</div>';
  const stage1 = !p.prototype;
  const n = p.comments.length;
  const plural = n > 1 ? 's' : '';
  const label = 'Synthesize';
  const enabled = p.directions.length > 0 && !busy[p.id] && (stage1 || n > 0);
  $('right').innerHTML = `
    <h4>Comments</h4>
    <div class="target-row"><span>Lead direction</span><span class="chip"><b>${esc(p.directions[p.lead]?.name || '—')}</b></span></div>
    <div class="target-row"><span>Target</span><span class="chip">${esc(targetText)}</span></div>
    <textarea class="ask" id="ask" placeholder="What should change here, or what to bring in from this direction?"></textarea>
    <div style="display:flex;gap:6px"><button id="addC" style="flex:1">Add comment</button>
      ${t ? '<button id="clearT">Clear</button>' : ''}</div>
    <div class="comments">${list}</div>
    <button class="dark go" id="synth" ${enabled ? '' : 'disabled'}>${label}</button>`;
  $('addC').onclick = () => {
    const text = $('ask').value.trim();
    if (!text) return;
    addComment(p, text);
    $('ask').value = ''; renderRight(p);
  };
  if ($('clearT')) $('clearT').onclick = () => { target = null; render(); };
  $('right').querySelectorAll('[data-remove]').forEach(b => b.onclick = () => { p.comments.splice(Number(b.dataset.remove), 1); save(); render(); });
  // Synthesize saves any comment still in the box first, so nothing typed is lost.
  $('synth').onclick = () => {
    const text = $('ask').value.trim();
    if (text) { addComment(p, text); $('ask').value = ''; }
    synthesize(p);
  };
}

function deleteProto(p) {
  if (busy[p.id]) { status('Wait for the current generation to finish, then delete.', true); return; }
  if (!confirm('Delete "' + (p.title || 'Untitled prototype') + '"? This cannot be undone.')) return;
  db.prototypes = db.prototypes.filter(x => x.id !== p.id);
  current = null; target = null;
  save(); status('Project deleted'); render();
}

// Every change is recorded, newest first, so any version can be restored.
function recordVersion(p, label, screens) {
  const list = screens || p.prototype.screens;
  p.versions = [{ at: new Date().toISOString(), label, screens: JSON.parse(JSON.stringify(list)) }, ...(p.versions || [])].slice(0, 50);
}

function restoreVersion(p, i) {
  const v = p.versions[i];
  if (!v) return;
  p.prototype = { name: 'Prototype', screens: JSON.parse(JSON.stringify(v.screens)) };
  recordVersion(p, 'Restored: ' + v.label);
  p.comments = []; target = null; shown = { ...shown, index: 0 }; save(); status('Restored an earlier version'); render();
}

// Comments on a screen or element go to the flow as screen comments. Comments with no target apply to the whole flow.
function splitComments(p) {
  const screenComments = p.comments.filter(c => c.level !== 'prototype').map(c => ({
    directionName: c.directionName || '', screenName: c.screenName || '',
    elementId: c.elementId || '', elementTag: c.elementTag || 'div', elementText: c.elementText || '',
    elementClasses: [], comment: c.comment,
  }));
  // A general comment belongs to the direction it was made on. On another direction it is a suggestion to bring in.
  const generalComment = p.comments.filter(c => c.level === 'prototype').map(c => {
    const otherDirection = !p.prototype && Number.isInteger(c.directionIndex) && c.directionIndex >= 0 && c.directionIndex !== p.lead;
    return otherDirection ? 'From "' + c.directionName + '": ' + c.comment : c.comment;
  }).join('\n');
  return { screenComments, generalComment };
}

async function synthesize(p) {
  const { screenComments, generalComment } = splitComments(p);
  const hasComments = screenComments.length > 0 || !!generalComment;

  // Stage one: the lead direction, plus any other directions the comments bring in, become one prototype.
  if (!p.prototype) {
    const lead = p.directions[p.lead];
    if (!lead) return;
    if (!hasComments) {
      p.prototype = { name: 'Prototype', screens: lead.screens || [] };
      recordVersion(p, 'From ' + (lead.name || 'lead direction'));
      shown = { ...shown, index: 0 }; save(); status('Prototype ready. Comment on a screen to change it.'); render();
      return;
    }
    const others = [...new Set(p.comments.map(c => c.directionIndex))]
      .filter(i => Number.isInteger(i) && i >= 0 && i !== p.lead);
    const picked = [lead, ...others.map(i => p.directions[i])];
    recordVersion(p, 'From ' + (lead.name || 'lead direction'), lead.screens || []);
    busy[p.id] = true; synthesizing = p.id; render();
    const data = await call({ mode: 'build', ...p.brief, selectedDirections: picked, screenComments, generalComment },
      'Building prototype');
    busy[p.id] = false; synthesizing = null;
    if (!data) { render(); return; }
    p.prototype = { name: 'Prototype', screens: (data.screens || []).map(withName) };
    recordVersion(p, 'Built from ' + picked.length + ' direction' + (picked.length > 1 ? 's' : ''));
    p.comments = []; target = null; shown = { ...shown, index: 0, tab: 'screens', dir: null };
    save(); status('Prototype ready'); render();
    return;
  }

  // Stage two: targeted changes. Each screen or element comment names one screen; a whole-flow comment changes what it names.
  if (!hasComments) return;
  busy[p.id] = true; render();
  const data = await call({ mode: 'iterate', ...p.brief, direction: p.prototype, screenComments, generalComment }, 'Applying changes');
  busy[p.id] = false;
  if (!data) { render(); return; }
  p.prototype = { name: 'Prototype', screens: (data.screens || []).map(withName) };
  recordVersion(p, p.comments.length + ' change' + (p.comments.length > 1 ? 's' : ''));
  p.comments = []; target = null; shown = { ...shown, tab: 'screens' };
  save(); status('Changes applied'); render();
}

load();
render();
</script>
</body>
</html>
